openapi: 3.1.0
info:
  title: org public API
  version: 0.1.0
security:
  - bearerAuth: []
paths:
  /orgs/{org_id}/branches:
    post:
      x-action-key: org:branch:create
      x-scope: none
      x-exposure: public
      operationId: createBranch
      parameters: [{$ref: "#/components/parameters/OrgID"}]
      responses:
        "201": {description: Branch created}
  /orgs/{org_id}:
    patch:
      x-action-key: org:org:update
      x-scope: none
      x-exposure: public
      operationId: updateOrg
      parameters: [{$ref: "#/components/parameters/OrgID"}]
      responses:
        "200": {description: Org updated}
  /orgs/{org_id}/memberships:
    get:
      x-action-key: org:membership:list
      x-scope: none
      x-exposure: public
      operationId: listMemberships
      parameters: [{$ref: "#/components/parameters/OrgID"}]
      responses:
        "200": {description: Membership page}
    post:
      x-action-key: org:membership:create
      x-scope: none
      x-exposure: public
      operationId: createMembership
      parameters: [{$ref: "#/components/parameters/OrgID"}]
      responses:
        "201": {description: Membership created}
  /orgs/{org_id}/memberships/{membership_id}:
    patch:
      x-action-key: org:membership:update
      x-scope: none
      x-exposure: public
      operationId: updateMembership
      parameters:
        - {$ref: "#/components/parameters/OrgID"}
        - {$ref: "#/components/parameters/MembershipID"}
      responses:
        "200": {description: Membership updated}
  /orgs/{org_id}/memberships/{membership_id}/roles:
    put:
      x-action-key: org:membership:manage
      x-scope: none
      x-exposure: public
      operationId: replaceMembershipRoles
      parameters:
        - {$ref: "#/components/parameters/OrgID"}
        - {$ref: "#/components/parameters/MembershipID"}
      responses:
        "200": {description: Roles replaced}
  /org/access-contexts/me:
    get:
      x-action-key: self
      x-scope: none
      x-exposure: public
      operationId: getMyAccessContexts
      responses:
        "200": {description: Caller memberships (employee branches); empty for a customer}
  /org/permissions/me:
    get:
      x-action-key: self
      x-scope: none
      x-exposure: public
      operationId: getMyPermissions
      parameters:
        - {$ref: "#/components/parameters/OrgIDQuery"}
        - {name: branch_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        "200": {description: Caller actions at the branch}
  /platform/me:
    get:
      x-action-key: self
      x-scope: none
      x-exposure: public
      operationId: getPlatformMe
      responses:
        "200": {description: Caller platform role and actions (404 when not platform staff)}
  /platform/companies:
    get:
      x-action-key: platform:org:read
      x-scope: none
      x-exposure: public
      operationId: listCompanies
      responses:
        "200": {description: Company page}
    post:
      x-action-key: platform:org:onboard
      x-scope: none
      x-exposure: public
      operationId: onboardCompany
      responses:
        "201": {description: Company onboarded by contract}
  /platform/companies/{root_branch_id}/modules:
    get:
      x-action-key: platform:org:read
      x-scope: none
      x-exposure: public
      operationId: listCompanyModulesPlatform
      parameters:
        - {$ref: "#/components/parameters/RootBranchID"}
      responses:
        "200": {description: Company modules}
  /platform/companies/{root_branch_id}/modules/{module_code}:
    put:
      x-action-key: platform:module:manage
      x-scope: none
      x-exposure: public
      operationId: setCompanyModule
      parameters:
        - {$ref: "#/components/parameters/RootBranchID"}
        - {$ref: "#/components/parameters/ModuleCode"}
      responses:
        "200": {description: Module set}
  /platform/companies/{root_branch_id}/role-matrix:
    get:
      x-action-key: platform:role_matrix:read
      x-scope: none
      x-exposure: public
      operationId: getCompanyRoleMatrixPlatform
      parameters:
        - {$ref: "#/components/parameters/RootBranchID"}
      responses:
        "200": {description: Role to actions of the company}
  /platform/companies/{root_branch_id}/role-matrix/roles/{role_code}:
    put:
      x-action-key: platform:role_matrix:update
      x-scope: none
      x-exposure: public
      operationId: replaceCompanyRoleActions
      parameters:
        - {$ref: "#/components/parameters/RootBranchID"}
        - {$ref: "#/components/parameters/RoleCode"}
      responses:
        "200": {description: Role actions replaced in every branch of the company}
  /platform/staff:
    get:
      x-action-key: platform:staff:manage
      x-scope: none
      x-exposure: public
      operationId: listPlatformStaff
      responses:
        "200": {description: Platform staff}
    post:
      x-action-key: platform:staff:manage
      x-scope: none
      x-exposure: public
      operationId: grantPlatformStaff
      responses:
        "201": {description: Platform role granted}
  /platform/staff/{user_id}/revoke:
    post:
      x-action-key: platform:staff:manage
      x-scope: none
      x-exposure: public
      operationId: revokePlatformStaff
      parameters:
        - {$ref: "#/components/parameters/UserID"}
      responses:
        "200": {description: Platform role revoked}
  /platform/support-access:
    get:
      x-action-key: platform:support_access:request
      x-scope: none
      x-exposure: public
      operationId: listMySupportAccess
      responses:
        "200": {description: Grants requested by the caller}
    post:
      x-action-key: platform:support_access:request
      x-scope: none
      x-exposure: public
      operationId: requestSupportAccess
      responses:
        "201": {description: Grant requested (STANDING when the company consents)}
  /platform/support-access/break-glass:
    post:
      x-action-key: platform:support_access:break_glass
      x-scope: none
      x-exposure: public
      operationId: breakGlass
      responses:
        "201": {description: Break-glass grant, 4h max}
  /platform/audit-logs:
    get:
      x-action-key: platform:audit:read
      x-scope: none
      x-exposure: public
      operationId: listAuditLogsPlatform
      responses:
        "200": {description: Audit page without before/after}
  /org/company/role-matrix:
    get:
      x-action-key: org:company:read
      x-scope: none
      x-exposure: public
      operationId: getCompanyRoleMatrix
      parameters:
        - {$ref: "#/components/parameters/OrgIDQuery"}
      responses:
        "200": {description: Role to actions of the company}
  /org/company/modules:
    get:
      x-action-key: org:company:read
      x-scope: none
      x-exposure: public
      operationId: listCompanyModules
      parameters:
        - {$ref: "#/components/parameters/OrgIDQuery"}
      responses:
        "200": {description: Company modules}
  /org/company/audit-logs:
    get:
      x-action-key: org:company:read
      x-scope: none
      x-exposure: public
      operationId: listCompanyAuditLogs
      parameters:
        - {$ref: "#/components/parameters/OrgIDQuery"}
      responses:
        "200": {description: Company audit page}
  /org/company/support-access:
    get:
      x-action-key: org:company:read
      x-scope: none
      x-exposure: public
      operationId: listCompanySupportAccess
      parameters:
        - {$ref: "#/components/parameters/OrgIDQuery"}
      responses:
        "200": {description: Support grants of the company}
  /org/company/settings:
    put:
      x-action-key: org:support_access:approve
      x-scope: none
      x-exposure: public
      operationId: updateCompanySettings
      parameters:
        - {$ref: "#/components/parameters/OrgIDQuery"}
      responses:
        "200": {description: Standing support consent set}
  /org/support-access/{grant_id}/approve:
    post:
      x-action-key: org:support_access:approve
      x-scope: none
      x-exposure: public
      operationId: approveSupportAccess
      parameters:
        - {$ref: "#/components/parameters/OrgIDQuery"}
        - {$ref: "#/components/parameters/GrantID"}
      responses:
        "200": {description: Grant active for 24h}
  /org/support-access/{grant_id}/revoke:
    post:
      x-action-key: org:support_access:approve
      x-scope: none
      x-exposure: public
      operationId: revokeSupportAccess
      parameters:
        - {$ref: "#/components/parameters/OrgIDQuery"}
        - {$ref: "#/components/parameters/GrantID"}
      responses:
        "200": {description: Grant revoked}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    OrgID: {name: org_id, in: path, required: true, schema: {type: string, format: uuid}}
    MembershipID: {name: membership_id, in: path, required: true, schema: {type: string, format: uuid}}
    RootBranchID: {name: root_branch_id, in: path, required: true, schema: {type: string, format: uuid}}
    ModuleCode: {name: module_code, in: path, required: true, schema: {type: string}}
    RoleCode: {name: role_code, in: path, required: true, schema: {type: string}}
    UserID: {name: user_id, in: path, required: true, schema: {type: string, format: uuid}}
    GrantID: {name: grant_id, in: path, required: true, schema: {type: string, format: uuid}}
    OrgIDQuery: {name: org_id, in: query, required: true, schema: {type: string, format: uuid}}
