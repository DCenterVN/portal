components:
  securitySchemes:
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateSupplierRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
        name:
          type: string
        tax_code:
          type: string
        address:
          type: object
          additionalProperties: true
        material_categories:
          type: array
          items:
            type: string
        food_safety_credential_media_ref:
          type: string
          format: uuid
      required:
      - code
      - name
    UpdateSupplierRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        tax_code:
          type: string
        address:
          type: object
          additionalProperties: true
        material_categories:
          type: array
          items:
            type: string
        food_safety_credential_media_ref:
          type: string
          format: uuid
      required: []
    SuspendSupplierRequest:
      type: object
      additionalProperties: false
      properties:
        operation:
          type: string
          enum:
          - SUSPEND
          - ACTIVATE
        reason:
          type: string
      required:
      - operation
      - reason
    SupplierResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        tax_code:
          type: string
        address:
          anyOf:
          - type: object
            additionalProperties: true
          - type: string
          - type: 'null'
        material_categories:
          type: array
          items:
            type: string
        food_safety_credential_media_ref:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        rating_grade:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - code
      - name
      - status
    SupplierPage:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SupplierResponse'
        next_cursor:
          type: string
      required:
      - items
      - next_cursor
    PresignSupplierContractDocumentRequest:
      type: object
