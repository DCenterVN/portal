    PriceSourceEvidence:
      type: object
      additionalProperties: false
      properties:
        url:
          type: string
          format: uri
          pattern: ^https?://
        sha256: &id013
          type: string
          pattern: ^[a-f0-9]{64}$
        quote:
          type: string
          minLength: 1
        observed_at: &id009
          type: string
          format: date-time
      required:
      - url
      - sha256
      - quote
      - observed_at
    SupplierPriceLineRequest:
      type: object
      additionalProperties: false
      properties:
        sku_ref: &id004
          type: string
          format: uuid
        uom: &id005
          type: string
          minLength: 1
        unit_price_vnd: &id006
          type: integer
          format: int64
          minimum: 0
        valid_from: &id002
          type: string
          format: date
        valid_to: *id002
        tax_treatment: &id003
          type: string
        delivery_treatment: *id003
        price_source_evidence: &id007
          anyOf:
          - $ref: '#/components/schemas/PriceSourceEvidence'
          - type: 'null'
      required:
      - sku_ref
      - uom
      - unit_price_vnd
      - valid_from
      - valid_to
    SupplierAgreementRequest:
      type: object
      additionalProperties: false
      properties:
        code:
          type: string
          minLength: 1
          pattern: \S
        valid_from: *id002
        valid_to: *id002
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - SUSPENDED
        status_reason:
          type: string
          minLength: 1
          maxLength: 500
        document_ref:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SupplierPriceLineRequest'
          minItems: 1
        dataset_mode:
          type: string
          enum:
          - REAL
          - DEMO
          default: REAL
      required:
      - code
      - valid_from
      - valid_to
      - status
      - lines
      allOf:
      - if:
          properties:
            status:
              const: ACTIVE
          required:
          - status
        then:
          required:
          - document_ref
          properties:
            document_ref:
              not:
                const: 00000000-0000-0000-0000-000000000000
            lines:
              items:
                required:
                - tax_treatment
                - delivery_treatment
                properties:
                  tax_treatment:
                    minLength: 1
                    pattern: \S
                  delivery_treatment:
                    minLength: 1
                    pattern: \S
      - if:
          properties:
            dataset_mode:
              const: DEMO
          required:
          - dataset_mode
        then:
          properties:
            lines:
              items:
                required:
                - price_source_evidence
                properties:
                  price_source_evidence:
                    $ref: '#/components/schemas/PriceSourceEvidence'
    SupplierPriceLineResponse:
      type: object
      additionalProperties: false
      properties:
        price_line_ref:
          type: string
          format: uuid
        sku_ref: *id004
        uom: *id005
        unit_price_vnd: *id006
        valid_from: *id002
        valid_to: *id002
        tax_treatment: *id003
        delivery_treatment: *id003
        price_source_evidence: *id007
        dataset_mode:
          type: string
          enum:
