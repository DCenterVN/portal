          enum:
          - image/jpeg
          - image/png
          - image/webp
          - application/pdf
        size_bytes:
          type: integer
          minimum: 1
          maximum: 5242880
        sha256: *id013
      required:
      - goods_receipt_line_id
      - receive_attempt_ref
      - purpose
      - content_type
      - size_bytes
      - sha256
      allOf:
      - if:
