          minimum: 1
          maximum: 5242880
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
      required:
      - filename
      - content_type
      - size_bytes
    FinalizeSupplierContractDocumentRequest:
      type: object
      additionalProperties: false
      properties:
