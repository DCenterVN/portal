openapi: 3.1.0
info:
  title: org public API
  version: 0.1.0
security:
- bearerAuth: []
paths:
  /org/access-contexts/me:
    get:
      x-action-key: self
      x-scope: none
      x-exposure: public
      operationId: getMyAccessContexts
      responses:
        '200':
          description: Branches the caller can enter (membership or all_branches, not CLOSED), each with branch_code, branch_name, branch_type and branch_status; empty for a customer
  /org/permissions/me:
    get:
      x-action-key: self
      x-scope: none
      x-exposure: public
      operationId: getMyPermissions
      parameters:
      - $ref: '#/components/parameters/OrgIDQuery'
      - name: branch_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Caller actions at the branch
  /org/company/roles:
    get:
      x-action-key: org:role:read
      x-scope: none
      x-exposure: public
      operationId: listCompanyRoles
      responses:
        '200':
          description: Assignable employee roles, each with the branch types it may be assigned at
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/RoleResponse'
        '401':
          description: Authentication required
        '403':
          description: Missing permission
        '503':
          description: UNAVAILABLE
  /org/company/role-matrix:
    get:
      x-action-key: org:company:read
      x-scope: none
      x-exposure: public
      operationId: getCompanyRoleMatrix
      responses:
        '200':
          description: Role to actions of the company
  /org/company/audit-logs:
    get:
      x-action-key: org:company:read
      x-scope: none
      x-exposure: public
      operationId: listCompanyAuditLogs
      responses:
        '200':
          description: Company audit page
  /org/company/role-matrix/roles/{role_code}:
    put:
      x-action-key: org:role:update
      x-scope: none
      x-exposure: public
      operationId: replaceCompanyRoleActions
      parameters:
      - $ref: '#/components/parameters/RoleCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - actions
              properties:
                actions:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Role actions replaced
        '400':
          description: Invalid request
        '401':
          description: Authentication required
        '403':
          description: Missing permission
        '404':
          description: Role not found
  /org/company:
    get:
      x-action-key: org:company:read
      x-scope: none
      x-exposure: public
      operationId: getCompany
      responses:
        '200':
          description: Company id and name (MAIN branch)
        '404':
          description: Company not found
  /org/company/memberships:
    get:
      x-action-key: org:membership:read
      x-scope: none
      x-exposure: public
      operationId: listCompanyMemberships
      parameters:
      - name: branch_id
        in: query
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/CompanyMembershipResponse'
                      page:
                        type: integer
                      limit:
                        type: integer
        '400':
          description: VALIDATION_ERROR
        '401':
          description: UNAUTHORIZED
        '403':
          description: FORBIDDEN
        '503':
          description: UNAVAILABLE
    post:
      x-action-key: org:employee:create
      x-scope: none
      x-exposure: public
      operationId: createCompanyMembership
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCompanyMembershipRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CompanyMembershipResponse'
        '400':
          description: VALIDATION_ERROR
        '401':
          description: UNAUTHORIZED
        '403':
          description: FORBIDDEN
        '404':
          description: NOT_FOUND
        '409':
          description: CONFLICT
        '503':
          description: UNAVAILABLE
  /org/company/memberships/{membership_id}/roles:
    put:
      x-action-key: org:membership:update
      x-scope: none
      x-exposure: public
      operationId: replaceCompanyMembershipRoles
      parameters:
      - $ref: '#/components/parameters/MembershipID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplaceCompanyMembershipRolesRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CompanyMembershipRolesResponse'
        '400':
          description: VALIDATION_ERROR
        '401':
          description: UNAUTHORIZED
        '403':
          description: FORBIDDEN
        '404':
          description: NOT_FOUND
        '409':
          description: CONFLICT
        '503':
          description: UNAVAILABLE
  /org/company/memberships/{membership_id}:
    patch:
      x-action-key: org:membership:update
      x-scope: none
      x-exposure: public
      operationId: updateCompanyMembership
      parameters:
      - $ref: '#/components/parameters/MembershipID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCompanyMembershipRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CompanyMembershipStatusResponse'
        '400':
          description: VALIDATION_ERROR
        '401':
          description: UNAUTHORIZED
        '403':
          description: FORBIDDEN
        '404':
          description: NOT_FOUND
        '409':
          description: CONFLICT
        '503':
          description: UNAVAILABLE
    delete:
      x-action-key: org:membership:update
      x-scope: none
      x-exposure: public
      operationId: deleteCompanyMembership
      parameters:
      - $ref: '#/components/parameters/MembershipID'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/DeleteCompanyMembershipResponse'
        '400':
          description: VALIDATION_ERROR
        '401':
          description: UNAUTHORIZED
        '403':
          description: FORBIDDEN
        '404':
          description: NOT_FOUND
        '409':
          description: CONFLICT
        '503':
          description: UNAVAILABLE
  /org/company/branches:
    get:
      x-action-key: org:branch:read
      x-scope: none
      x-exposure: public
      operationId: listCompanyBranches
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          $ref: '#/components/schemas/BranchResponse'
                      page:
                        type: integer
                      limit:
                        type: integer
        '400':
          description: VALIDATION_ERROR
        '401':
          description: UNAUTHORIZED
        '403':
          description: FORBIDDEN
        '503':
          description: UNAVAILABLE
    post:
      x-action-key: org:branch:create
      x-scope: none
      x-exposure: public
      operationId: createCompanyBranch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBranchRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BranchResponse'
        '400':
          description: VALIDATION_ERROR
        '401':
          description: UNAUTHORIZED
        '403':
          description: FORBIDDEN
        '409':
          description: CONFLICT
        '503':
          description: UNAVAILABLE
  /org/company/branches/{branch_id}:
    patch:
      x-action-key: org:branch:update
      x-scope: none
      x-exposure: public
      operationId: updateCompanyBranch
      parameters:
      - name: branch_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateBranchRequest'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/BranchResponse'
        '400':
          description: VALIDATION_ERROR
        '401':
          description: UNAUTHORIZED
        '403':
          description: FORBIDDEN
        '404':
          description: NOT_FOUND
        '409':
          description: CONFLICT
        '503':
          description: UNAVAILABLE
components:
  schemas:
    RoleResponse:
      type: object
      required:
      - code
      - name
      - description
      - sort_order
      - protected
      - branch_types
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
        sort_order:
          type: integer
        protected:
          type: boolean
        branch_types:
          type: array
          items:
            type: string
            enum:
            - CENTRAL_KITCHEN
            - STORE
    CreateCompanyMembershipRequest:
      type: object
      additionalProperties: false
      required:
      - role_codes
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        role_codes:
          type: array
          items: &id001
            type: string
          minItems: 1
        branch_id:
          type: string
          format: uuid
    ReplaceCompanyMembershipRolesRequest:
      type: object
      additionalProperties: false
      required:
      - role_codes
      properties:
        role_codes: &id002
          type: array
          items: *id001
    UpdateCompanyMembershipRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        status: &id003
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
        all_branches:
          type: boolean
    CompanyMembershipResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - user_id
      - branch_id
      - branch_name
      - all_branches
      - role_codes
      - status
      - display_name
      - email
      properties:
        id:
          type: string
        user_id:
          type: string
        branch_id:
          type: string
        branch_name:
          type: string
        all_branches:
          type: boolean
        role_codes: *id002
        status: *id003
        display_name:
          type: string
        email:
          type: string
    DeleteCompanyMembershipResponse:
      type: object
      properties:
        membership_id:
          type: string
          format: uuid
    CompanyMembershipRolesResponse:
      type: object
      additionalProperties: false
      required:
      - membership_id
      - role_codes
      properties:
        membership_id:
          type: string
        role_codes: *id002
    CompanyMembershipStatusResponse:
      type: object
      additionalProperties: false
      required:
      - membership_id
      - status
      - all_branches
      properties:
        membership_id:
          type: string
        status: *id003
        all_branches:
          type: boolean
    CreateBranchRequest:
      type: object
      additionalProperties: false
      required:
      - code
      - name
      properties:
        code:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 1
          maxLength: 255
        type:
          type: string
          enum:
          - CENTRAL_KITCHEN
          - STORE
          default: STORE
    UpdateBranchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSED
    BranchResponse:
      type: object
      additionalProperties: false
      required:
      - id
      - code
      - name
      - type
      - status
      - employee_count
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - CENTRAL_KITCHEN
          - STORE
        status:
          type: string
          enum:
          - ACTIVE
          - SUSPENDED
          - CLOSED
        employee_count:
          type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    MembershipID:
      name: membership_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleCode:
      name: role_code
      in: path
      required: true
      schema:
        type: string
    OrgIDQuery:
      name: org_id
      in: query
      required: true
      schema:
        type: string
        format: uuid
